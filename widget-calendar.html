<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cue - Calendar Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #a855f7;
            --purple-light: #c084fc;
            --bg: #09090b;
            --surface: #141417;
            --surface-hover: #1c1c21;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f5;
            --text-muted: #94949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            border-radius: 20px;
            overflow: hidden;
            padding: 14px 16px;
            line-height: 1.4;
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .widget-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            letter-spacing: -0.04em;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .widget-logo .gem {
            color: var(--purple);
            font-size: 16px;
        }

        .widget-badge {
            font-size: 11px;
            font-weight: 700;
            background: rgba(168, 85, 247, 0.15);
            color: var(--purple-light);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 99px;
            padding: 3px 10px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .weekday-grid,
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: left;
        }

        .weekday-grid {
            margin-bottom: 4px;
        }

        .weekday {
            padding: 2px 0;
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-align: center;
            text-transform: uppercase;
        }

        .cell {
            min-height: clamp(46px, 12vw, 64px);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: clamp(5px, 1.2vw, 7px) clamp(4px, 1vw, 6px);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3px;
            font-size: clamp(10px, 2.4vw, 12px);
            font-weight: 600;
            background: var(--surface);
            color: var(--text-main);
            overflow: hidden;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .empty-cell {
            background: transparent;
            border-color: transparent;
        }

        .day-number {
            line-height: 1;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-main);
        }

        .has-event {
            background: rgba(168, 85, 247, 0.06);
            border-color: rgba(168, 85, 247, 0.2);
        }

        .today {
            border-color: rgba(168, 85, 247, 0.7);
            background: rgba(168, 85, 247, 0.12);
            box-shadow: inset 0 0 0 1px rgba(168, 85, 247, 0.3);
        }

        .today .day-number {
            color: var(--purple-light);
        }

        .event-name {
            display: flex;
            align-items: center;
            gap: 4px;
            box-sizing: border-box;
            min-height: 18px;
            width: 100%;
            border-radius: 5px;
            padding: 2px 5px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(192, 132, 252, 0.5));
            border: 1px solid rgba(168, 85, 247, 0.6);
            color: #fff;
            font-size: clamp(7px, 1.8vw, 9px);
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: 0.02em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .event-name img {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .event-name-text {
            display: block;
            width: 100%;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .event-more {
            color: var(--purple-light);
            font-size: 8px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="widget-header">
        <div class="widget-logo">cue<span class="gem">✦</span></div>
        <div class="widget-badge" id="mTitle">March 2026</div>
    </div>
    <div class="weekday-grid" aria-hidden="true">
        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>
    </div>
    <div class="grid" id="cGrid"></div>

    <script>
        const now = new Date();
        document.getElementById('mTitle').textContent = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        let events = [];
        try { events = JSON.parse(localStorage.getItem('cue-events-v12')) || []; } catch (e) { }
        function isPast(ev) {
            const d = new Date((ev.endDate || ev.startDate) + 'T23:59:59'); return d < new Date();
        }

        function imageUrl(event) {
            const value = String(event.image || '');
            if (/^data:image\/(jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(value)) return value;
            if (/^https:\/\//i.test(value)) return value;
            return '';
        }

        const y = now.getFullYear(); const m = now.getMonth();
        const daysInM = new Date(y, m + 1, 0).getDate();
        const todayStr = new Date().toISOString().slice(0, 10);

        const firstDay = new Date(y, m, 1).getDay();
        let grid = '';
        for (let i = 0; i < firstDay; i++) grid += '<div class="cell empty-cell"></div>';
        for (let i = 1; i <= daysInM; i++) {
            const str = `${y}-${String(m + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            const dayEvents = events.filter(event => {
                if (!event.startDate || isPast(event)) return false;
                return str >= event.startDate && str <= (event.endDate || event.startDate);
            });
            const hasE = dayEvents.length > 0;
            const isT = (str === todayStr);
            const cls = 'cell' + (hasE ? ' has-event' : '') + (isT ? ' today' : '');
            const visible = dayEvents.slice(0, 2);
            const names = visible.map(event => {
                let bg = 'linear-gradient(135deg, rgba(168, 85, 247, 0.35), rgba(192, 132, 252, 0.45))';
                let border = 'rgba(168, 85, 247, 0.6)';
                let textCol = '#ffffff';

                if (event.category === 'Festival') {
                    bg = 'linear-gradient(135deg, rgba(245, 158, 11, 0.35), rgba(251, 191, 36, 0.45))';
                    border = 'rgba(245, 158, 11, 0.7)';
                    textCol = '#fef08a';
                } else if (event.category === 'Other' || event.category === 'Party') {
                    bg = 'linear-gradient(135deg, rgba(20, 184, 166, 0.35), rgba(45, 212, 191, 0.45))';
                    border = 'rgba(20, 184, 166, 0.7)';
                    textCol = '#99f6e4';
                }

                return `<div class="event-name" style="background:${bg}; border-color:${border}; color:${textCol};" title="${event.artist || 'Event'}">${imageUrl(event) ? `<img src="${imageUrl(event)}" alt="">` : ''}<span class="event-name-text">${event.artist || 'Event'}</span></div>`;
            }).join('');
            const remaining = dayEvents.length - visible.length;
            grid += `<div class="${cls}"><span class="day-number">${i}</span>${names}${remaining > 0 ? `<span class="event-more">+${remaining} more</span>` : ''}</div>`;
        }
        document.getElementById('cGrid').innerHTML = grid;
    </script>
</body>

</html>
