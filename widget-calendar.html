<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cue - Calendar Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #a855f7;
            --purple-light: #c084fc;
            --bg: #09090b;
            --surface: #141417;
            --surface-soft: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f5;
            --text-muted: #94949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            border-radius: 20px;
            overflow: hidden;
            padding: 14px 16px;
            line-height: 1.4;
        }

        .cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .cal-title-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cal-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            letter-spacing: -0.04em;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .cal-logo .gem {
            color: var(--purple);
            font-size: 16px;
        }

        .cal-month-title {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-main);
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 3px;
        }

        .cal-day-label {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: center;
            padding: 4px 0;
        }

        .cal-cell {
            min-height: clamp(52px, 13vw, 68px);
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 5px 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 3px;
            position: relative;
            overflow: hidden;
        }

        .cal-cell.empty-cell {
            background: transparent;
            border-color: transparent;
            pointer-events: none;
        }

        .cal-day-num {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            line-height: 1;
            display: block;
            margin-bottom: 2px;
        }

        .cal-cell.today {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: inset 0 0 0 1px rgba(168, 85, 247, 0.18);
        }

        .cal-cell.today .cal-day-num {
            color: var(--purple-light);
        }

        .cal-event-pill {
            display: flex;
            align-items: center;
            gap: 3px;
            width: 100%;
            border-radius: 6px;
            min-height: 16px;
            padding: 2px 4px;
            font-size: clamp(7.5px, 1.8vw, 9px);
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: 0.02em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .cal-event-pill img {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .cal-event-pill-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .cal-more-text {
            font-size: 8px;
            font-weight: 700;
            color: var(--purple-light);
            margin-top: 1px;
        }
    </style>
</head>

<body>
    <div class="cal-header">
        <div class="cal-title-wrap">
            <div class="cal-logo">cue<span class="gem">✦</span></div>
        </div>
        <h3 class="cal-month-title" id="calMonthTitle">March 2026</h3>
    </div>

    <div class="cal-grid">
        <div class="cal-day-label">Sun</div>
        <div class="cal-day-label">Mon</div>
        <div class="cal-day-label">Tue</div>
        <div class="cal-day-label">Wed</div>
        <div class="cal-day-label">Thu</div>
        <div class="cal-day-label">Fri</div>
        <div class="cal-day-label">Sat</div>
    </div>
    <div class="cal-grid" id="calGrid" style="margin-top: 4px;"></div>

    <script>
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        document.getElementById('calMonthTitle').textContent = `${monthNames[month]} ${year}`;

        const TEST_WIDGET_EVENTS = [
            { id: 'tw-1', artist: 'Sonar Festival 2026', category: 'Festival', startDate: '2026-09-12', endDate: '2026-09-14', time: '18:00', city: 'Lisbon', venue: 'Parque das Nações' },
            { id: 'tw-2', artist: 'Tame Impala', category: 'Concert', startDate: '2026-09-18', endDate: '2026-09-18', time: '21:30', city: 'Lisbon', venue: 'MEO Arena' },
            { id: 'tw-3', artist: 'Peggy Gou', category: 'Party', startDate: '2026-09-25', endDate: '2026-09-25', time: '23:00', city: 'Lisbon', venue: 'Lux Frágil' }
        ];

        let events = [];
        try {
            events = JSON.parse(localStorage.getItem('cue-events-v12')) || [];
            if (!events || events.length === 0) events = TEST_WIDGET_EVENTS;
        } catch (e) { events = TEST_WIDGET_EVENTS; }

        function isPast(ev) {
            const d = new Date((ev.endDate || ev.startDate) + 'T23:59:59');
            return d < new Date();
        }

        function imageUrl(event) {
            const value = String(event.image || '');
            if (/^data:image\/(jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(value)) return value;
            if (/^https:\/\//i.test(value)) return value;
            return '';
        }

        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const todayStr = now.toISOString().slice(0, 10);
        const firstDay = new Date(year, month, 1).getDay();

        const grid = document.getElementById('calGrid');
        let gridHtml = '';

        for (let i = 0; i < firstDay; i++) {
            gridHtml += '<div class="cal-cell empty-cell"></div>';
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayEvents = events.filter(event => {
                if (!event.startDate) return false;
                if (event.endDate) return dateKey >= event.startDate && dateKey <= event.endDate;
                return event.startDate === dateKey;
            }).sort((a, b) => {
                const aMulti = a.endDate && a.endDate !== a.startDate ? 1 : 0;
                const bMulti = b.endDate && b.endDate !== b.startDate ? 1 : 0;
                if (aMulti !== bMulti) return bMulti - aMulti;
                return (a.artist || '').localeCompare(b.artist || '');
            });

            const isToday = (dateKey === todayStr);
            const cellClass = 'cal-cell' + (isToday ? ' today' : '');
            const visibleEvents = dayEvents.slice(0, 2);

            const pillsHtml = visibleEvents.map(event => {
                let background = 'linear-gradient(135deg, rgba(168, 85, 247, 0.35), rgba(192, 132, 252, 0.45))';
                let border = 'rgba(168, 85, 247, 0.6)';
                let textColor = '#ffffff';

                if (event.category === 'Festival') {
                    background = 'linear-gradient(135deg, rgba(245, 158, 11, 0.35), rgba(251, 191, 36, 0.45))';
                    border = 'rgba(245, 158, 11, 0.7)';
                    textColor = '#fef08a';
                } else if (event.category === 'Other' || event.category === 'Party') {
                    background = 'linear-gradient(135deg, rgba(20, 184, 166, 0.35), rgba(45, 212, 191, 0.45))';
                    border = 'rgba(20, 184, 166, 0.7)';
                    textColor = '#99f6e4';
                }

                const img = imageUrl(event);
                return `<div class="cal-event-pill" style="background:${background}; border:1px solid ${border}; color:${textColor};" title="${event.artist || 'Event'}">${img ? `<img src="${img}" alt="">` : ''}<span class="cal-event-pill-text">${event.artist || 'Event'}</span></div>`;
            }).join('');

            const remaining = dayEvents.length - visibleEvents.length;
            const moreHtml = remaining > 0 ? `<div class="cal-more-text">+${remaining} more</div>` : '';

            gridHtml += `<div class="${cellClass}"><span class="cal-day-num">${day}</span>${pillsHtml}${moreHtml}</div>`;
        }

        grid.innerHTML = gridHtml;
    </script>
</body>

</html>
