<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cue - Calendar Widget</title>
    <style>
        :root {
            --bg: #000;
            --surface: #121214;
            --purple: #a855f7;
            --border: #27272a;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 12px;
            background: var(--bg);
            color: #fff;
            border-radius: 16px;
        }

        .month-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--purple);
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }

        .cell {
            aspect-ratio: 1;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
            background: var(--surface);
            color: #ccc;
        }

        .has-event {
            background: rgba(168, 85, 247, 0.2);
            color: #fff;
            border: 1px solid var(--purple);
        }

        .today {
            font-weight: 800;
            border-bottom: 2px solid var(--purple);
        }
    </style>
</head>

<body>
    <div class="month-title" id="mTitle">March 2026</div>
    <div class="grid" id="cGrid"></div>
    <script>
        const now = new Date();
        document.getElementById('mTitle').textContent = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        let events = [];
        try { events = JSON.parse(localStorage.getItem('cue-events-v12')) || []; } catch (e) { }
        const eventDates = new Set(events.filter(e => !isPast(e) && e.startDate).map(e => e.startDate));

        function isPast(ev) {
            const d = new Date((ev.endDate || ev.startDate) + 'T23:59:59'); return d < new Date();
        }

        const y = now.getFullYear(); const m = now.getMonth();
        const daysInM = new Date(y, m + 1, 0).getDate();
        const todayStr = new Date().toISOString().slice(0, 10);

        let grid = '';
        for (let i = 1; i <= daysInM; i++) {
            const str = `${y}-${String(m + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            const hasE = eventDates.has(str);
            const isT = (str === todayStr);
            const cls = 'cell' + (hasE ? ' has-event' : '') + (isT ? ' today' : '');
            grid += `<div class="${cls}">${i}</div>`;
        }
        document.getElementById('cGrid').innerHTML = grid;
    </script>
</body>

</html>
