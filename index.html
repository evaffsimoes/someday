<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cue — Never miss your cue.</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg: #000000;
      --surface: #121214;
      --surface-card: #18181b;
      --border: #27272a;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --purple: #a855f7;
      --purple-dark: #7e22ce;
      --purple-light: #c084fc;
      --purple-glow: rgba(168, 85, 247, 0.25);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 100px;
      line-height: 1.5;
    }

    .wrap {
      max-width: 540px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    .logo-img {
      height: 44px;
      width: auto;
      margin: 0 auto 8px;
      display: block;
    }

    .tagline {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    /* Sticky Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: #09090b;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      padding: 0 16px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 16px;
      transition: all 0.2s ease;
      flex: 1;
    }

    .nav-btn.active {
      color: var(--purple-light);
    }

    .nav-btn-center {
      background: var(--purple);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 16px var(--purple-glow);
      transition: transform 0.2s ease, background 0.2s ease;
      flex: none;
      margin: 0 8px;
    }

    .nav-btn-center:hover {
      transform: scale(1.06);
      background: var(--purple-light);
    }

    .tab-screen {
      display: none;
    }

    .tab-screen.active {
      display: block;
    }

    /* NEXT UP Spotlight Card */
    .spotlight-card {
      background: linear-gradient(135deg, #1e112a 0%, #121214 100%);
      border: 1px solid var(--purple-glow);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .spotlight-card::after {
      content: '';
      position: absolute;
      top: -20px;
      right: -20px;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, var(--purple-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    .spotlight-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--purple-light);
      margin-bottom: 6px;
      display: block;
    }

    .spotlight-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .spotlight-meta {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(168, 85, 247, 0.15);
      color: var(--purple-light);
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    /* Section Titles */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Compact Event Card in Queue */
    .queue-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .queue-item:hover {
      border-color: #3f3f46;
      background: var(--surface-card);
    }

    .queue-img {
      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .queue-img-placeholder {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1f1f23;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .queue-info {
      flex: 1;
      min-width: 0;
    }

    .queue-artist {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }

    .queue-details {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .queue-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.2s;
      font-size: 14px;
    }

    .icon-btn:hover {
      color: var(--text-main);
    }

    /* Add Event Options Card */
    .add-option-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-option-card:hover {
      border-color: var(--purple-light);
      background: var(--surface-card);
    }

    .add-icon {
      font-size: 24px;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #27272a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .add-text strong {
      font-size: 15px;
      font-weight: 600;
      display: block;
      color: #ffffff;
    }

    .add-text span {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Magic AI Parsing Card */
    .ai-parsing-card {
      background: linear-gradient(135deg, #181124 0%, #121214 100%);
      border: 1px solid var(--purple-glow);
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
    }

    .parsing-status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      color: var(--purple-light);
      margin-bottom: 16px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(192, 132, 252, 0.2);
      border-top-color: var(--purple-light);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .parsed-field {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
    }

    .parsed-field strong {
      color: #ffffff;
      font-weight: 500;
    }

    /* Fixed Modal Overlay for Event Details */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .full-modal-img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    /* Forms & Modal */
    .review {
      margin-top: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      background: #09090b;
      color: var(--text-main);
      transition: border-color 0.2s;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--purple);
    }

    .field textarea {
      resize: vertical;
      min-height: 60px;
    }

    .review-row {
      display: flex;
      gap: 10px;
    }

    .review-row .field {
      flex: 1;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--purple);
      color: #ffffff;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: var(--surface-card);
    }

    /* Interactive Calendar Component */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .cal-day-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding-bottom: 6px;
    }

    .cal-cell {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .cal-cell:hover {
      border-color: var(--purple);
    }

    .cal-cell.empty-cell {
      background: transparent;
      border: none;
      cursor: default;
    }

    .cal-cell.today {
      border-color: var(--purple-light);
      font-weight: 700;
    }

    .cal-cell.selected {
      background: var(--purple);
      color: #ffffff;
    }

    .cal-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--purple-light);
      position: absolute;
      bottom: 4px;
    }

    .empty {
      padding: 32px 0;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <img src="icon-512.png" alt="cue logo" class="logo-img">
      <p class="tagline">Never miss your cue.</p>
    </header>

    <!-- TAB 1: QUEUE (HOME) -->
    <div id="screen-queue" class="tab-screen active">
      <div id="spotlightSlot"></div>
      <div class="section-title">UPCOMING QUEUE</div>
      <div id="upcomingList"></div>
      <div class="section-title">PAST QUEUE</div>
      <div id="pastList"></div>
    </div>

    <!-- TAB 2: ADD TO CUE (+) -->
    <div id="screen-add" class="tab-screen">
      <h2 style="font-size: 20px; font-weight:700; margin: 0 0 16px;">Add to cue</h2>

      <div class="add-option-card" id="btnOptionScreenshot">
        <div class="add-icon">📸</div>
        <div class="add-text">
          <strong>Screenshot</strong>
          <span>Upload an Instagram poster or story photo</span>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display: none;">

      <div class="add-option-card" id="btnOptionLink">
        <div class="add-icon">🔗</div>
        <div class="add-text">
          <strong>Instagram link</strong>
          <span>Paste a copied link or post caption</span>
        </div>
      </div>

      <div class="add-option-card" id="btnOptionManual">
        <div class="add-icon">✍️</div>
        <div class="add-text">
          <strong>Add manually</strong>
          <span>Type event details by hand</span>
        </div>
      </div>

      <div class="status" id="status"></div>
      <div id="aiParsingSlot"></div>
      <div id="reviewSlot"></div>
    </div>

    <!-- TAB 3: CALENDAR -->
    <div id="screen-calendar" class="tab-screen">
      <div class="cal-header">
        <button class="btn btn-ghost" id="calPrevBtn" style="padding: 6px 12px; font-size:12px; flex:none;">← Prev</button>
        <h3 id="calMonthTitle" style="margin:0; font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;"></h3>
        <button class="btn btn-ghost" id="calNextBtn" style="padding: 6px 12px; font-size:12px; flex:none;">Next →</button>
      </div>
      <div class="cal-grid" id="calDaysHeader">
        <div class="cal-day-label">Sun</div>
        <div class="cal-day-label">Mon</div>
        <div class="cal-day-label">Tue</div>
        <div class="cal-day-label">Wed</div>
        <div class="cal-day-label">Thu</div>
        <div class="cal-day-label">Fri</div>
        <div class="cal-day-label">Sat</div>
      </div>
      <div class="cal-grid" id="calGrid" style="margin-top: 8px;"></div>
      
      <div class="section-title" id="calSelectedTitle" style="margin-top:32px;">YOUR EVENTS</div>
      <div id="calSelectedList"></div>
    </div>

    <datalist id="pt-cities">
      <option value="Porto">
      <option value="Lisbon">
      <option value="Vila Nova de Gaia">
      <option value="Braga">
      <option value="Coimbra">
      <option value="Faro">
      <option value="Aveiro">
      <option value="Cascais">
      <option value="Guimarães">
      <option value="Leiria">
    </datalist>
  </div>

  <!-- STICKY BOTTOM NAVIGATION BAR (Queue | + | Calendar) -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="queue">
      <span style="font-size: 18px;">🎟️</span>
      <span>Queue</span>
    </button>
    <button class="nav-btn-center" id="navBtnPlus" data-tab="add" title="Add to cue">
      <span>+</span>
    </button>
    <button class="nav-btn" data-tab="calendar">
      <span style="font-size: 18px;">📅</span>
      <span>Calendar</span>
    </button>
  </nav>

  <script>
    const STORE_KEY = 'cue-events-v12';
    let events = [];
    let calCurrentDate = new Date();
    let calSelectedDateStr = null;

    function uid() { return 'cue_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

    function getStorageItem(key) {
      try {
        if (window.storage && typeof window.storage.get === 'function') {
          return window.storage.get(key).then(res => res ? res.value : null).catch(() => localStorage.getItem(key));
        }
      } catch (e) { }
      return Promise.resolve(localStorage.getItem(key));
    }

    function setStorageItem(key, val) {
      try {
        if (window.storage && typeof window.storage.set === 'function') {
          return window.storage.set(key, val).catch(() => localStorage.setItem(key, val));
        }
      } catch (e) { }
      localStorage.setItem(key, val);
      return Promise.resolve();
    }

    async function loadEvents() {
      try {
        const raw = await getStorageItem(STORE_KEY) || await getStorageItem('someday-events');
        events = raw ? JSON.parse(raw) : [];
        events = events.map(e => {
          if (e.name && !e.artist) e.artist = e.name;
          if (e.location && !e.venue) e.venue = e.location;
          if (!e.category) e.category = 'Concert';
          return e;
        });
      } catch (e) { events = []; }
      render();
      renderCalendar();
    }

    async function saveEvents() {
      try { await setStorageItem(STORE_KEY, JSON.stringify(events)); }
      catch (e) { console.error('save failed', e); }
    }

    function fmtDate(dStr) {
      if (!dStr) return 'Date unknown';
      const d = new Date(dStr + 'T00:00:00');
      if (isNaN(d)) return dStr;
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function isPast(ev) {
      const checkDate = ev.endDate || ev.startDate;
      if (!checkDate) return false;
      const d = new Date(checkDate + 'T23:59:59');
      return d < new Date();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
      });
      document.querySelectorAll('.tab-screen').forEach(screen => {
        screen.classList.toggle('active', screen.id === `screen-${tabName}`);
      });
      if (tabName === 'calendar') {
        renderCalendar();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.querySelectorAll('.nav-btn, .nav-btn-center').forEach(btn => {
      btn.onclick = () => switchTab(btn.getAttribute('data-tab'));
    });

    function render() {
      const upcoming = events.filter(e => !isPast(e)).sort((a, b) => (a.startDate || '9999').localeCompare(b.startDate || '9999'));
      const past = events.filter(e => isPast(e)).sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));

      // NEXT UP Spotlight Card
      const spotlightSlot = document.getElementById('spotlightSlot');
      if (upcoming.length > 0) {
        const next = upcoming[0];
        const dateStr = fmtDate(next.startDate);
        const timeStr = next.time ? ` · ${next.time}` : '';
        const locStr = [next.venue, next.city].filter(Boolean).join(' · ');

        spotlightSlot.innerHTML = `
          <div class="spotlight-card" data-view="${next.id}">
            <span class="spotlight-label">NEXT UP</span>
            <div class="spotlight-title">${escapeHtml(next.artist || 'Untitled event')}</div>
            <div class="spotlight-meta">
              <span>📅 ${dateStr}${timeStr}</span>
              ${locStr ? `<span>📍 ${escapeHtml(locStr)}</span>` : ''}
              <span class="category-pill">${escapeHtml(next.category || 'Concert')}</span>
            </div>
          </div>`;
      } else {
        spotlightSlot.innerHTML = '';
      }

      document.getElementById('upcomingList').innerHTML = upcoming.length
        ? upcoming.map(queueItemHTML).join('')
        : '<div class="empty">Your queue is empty. Tap "+" to add a concert or festival!</div>';

      document.getElementById('pastList').innerHTML = past.length
        ? past.map(queueItemHTML).join('')
        : '<div class="empty">Past events will land here.</div>';

      document.querySelectorAll('[data-view]').forEach(el => {
        el.onclick = () => {
          const ev = events.find(e => e.id === el.getAttribute('data-view'));
          openDetailModal(ev);
        };
      });
      document.querySelectorAll('[data-del]').forEach(btn => {
        btn.onclick = (e) => { e.stopPropagation(); deleteEvent(btn.getAttribute('data-del')); };
      });
    }

    function queueItemHTML(ev) {
      const dateStr = fmtDate(ev.startDate);
      const timeStr = ev.time ? ` · ${ev.time}` : '';
      const locStr = [ev.venue, ev.city].filter(Boolean).join(' · ');

      const imgHTML = ev.image
        ? `<img src="${ev.image}" class="queue-img" alt="Poster">`
        : `<div class="queue-img-placeholder">🎟️</div>`;

      return `
        <div class="queue-item" data-view="${ev.id}">
          ${imgHTML}
          <div class="queue-info">
            <div class="queue-artist">${escapeHtml(ev.artist || 'Untitled event')}</div>
            <div class="queue-details">${dateStr}${timeStr} ${locStr ? `· ${escapeHtml(locStr)}` : ''}</div>
          </div>
          <span class="category-pill">${escapeHtml(ev.category || 'Concert')}</span>
        </div>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function deleteEvent(id) {
      events = events.filter(e => e.id !== id);
      await saveEvents();
      render();
      renderCalendar();
    }

    function toGCalDate(dateStr, timeStr) {
      if (!dateStr) return null;
      const datePart = dateStr.replace(/-/g, '');
      if (timeStr) {
        const m = timeStr.match(/(\d{1,2}):(\d{2})/);
        if (m) {
          let hh = m[1].padStart(2, '0'), mm = m[2];
          return `${datePart}T${hh}${mm}00`;
        }
      }
      return datePart;
    }

    function gcalUrl(ev) {
      const start = toGCalDate(ev.startDate, ev.time);
      let dates = start;

      if (start && start.includes('T')) {
        const end = toGCalDate(ev.endDate, null);
        if (end) {
          dates = `${start}/${end}T235900`;
        } else {
          const d = new Date(ev.startDate + 'T' + (ev.time || '21:00'));
          const endD = new Date(d.getTime() + 3 * 60 * 60 * 1000);
          dates = `${start}/${endD.toISOString().replace(/[-:]/g, '').split('.')[0]}`;
        }
      } else if (start) {
        dates = `${start}/${start}`;
      }

      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: ev.artist || 'Event',
        details: ev.description || 'Saved to cue: Never miss your cue.',
        location: [ev.venue, ev.city].filter(Boolean).join(', ')
      });
      if (dates) params.set('dates', dates);
      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    function downloadIcs(ev) {
      const start = toGCalDate(ev.startDate, ev.time) || new Date().toISOString().replace(/[-:]/g, '').split('.')[0];
      const dtStart = start.includes('T') ? start : start + 'T210000';
      const startDate = new Date(
        dtStart.slice(0, 4), dtStart.slice(4, 6) - 1, dtStart.slice(6, 8),
        dtStart.slice(9, 11) || 21, dtStart.slice(11, 13) || 0
      );
      const endDate = new Date(startDate.getTime() + 3 * 60 * 60 * 1000);

      const fmt = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const ics = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//cue//EN', 'BEGIN:VEVENT',
        `UID:${ev.id}@cue-app`,
        `DTSTAMP:${fmt(new Date())}`,
        `DTSTART:${fmt(startDate)}`,
        `DTEND:${fmt(endDate)}`,
        `SUMMARY:${(ev.artist || 'Event').replace(/\n/g, ' ')}`,
        ev.venue ? `LOCATION:${[ev.venue, ev.city].filter(Boolean).join(', ').replace(/\n/g, ' ')}` : '',
        ev.description ? `DESCRIPTION:${ev.description.replace(/\n/g, ' ')}` : '',
        'END:VEVENT', 'END:VCALENDAR'
      ].filter(Boolean).join('\r\n');
      const blob = new Blob([ics], { type: 'text/calendar' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (ev.artist || 'event').replace(/[^a-z0-9]+/gi, '_') + '.ics';
      a.click();
    }

    // ---- Add Options Handlers ----
    const fileInput = document.getElementById('fileInput');
    const statusEl = document.getElementById('status');
    const aiParsingSlot = document.getElementById('aiParsingSlot');
    const reviewSlot = document.getElementById('reviewSlot');

    document.getElementById('btnOptionScreenshot').onclick = () => fileInput.click();
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    document.getElementById('btnOptionLink').onclick = async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          handleSharedText(text);
        } else {
          statusEl.textContent = 'Clipboard is empty — copy an Instagram link or caption first!';
        }
      } catch (e) {
        const url = prompt('Paste Instagram link or caption here:');
        if (url) handleSharedText(url);
      }
    };

    document.getElementById('btnOptionManual').onclick = () => openReview({});

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result.split(',')[1]);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    async function handleFile(file) {
      renderAiParsingState();
      try {
        const base64 = await fileToBase64(file);
        const mediaType = file.type || 'image/jpeg';
        const today = new Date().toISOString().slice(0, 10);

        const response = await fetch(getApiEndpoint(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: `Today's date is ${today}. This image is a screenshot or poster of an Instagram event post. Extract the music/event details and respond ONLY with a JSON object in this exact shape: {"artist": string (Artist or Event Name), "startDate": "YYYY-MM-DD" or "", "endDate": "YYYY-MM-DD" or "", "time": "HH:MM" (24h) or "", "venue": string (Venue name), "city": string (City in Portugal), "category": "Concert" or "Festival" or "Party" or "Other", "description": string (short 1-sentence note)}.` },
                { inlineData: { mimeType: mediaType, data: base64 } }
              ]
            }]
          })
        });

        const textRes = await response.text();
        let data;
        try { data = JSON.parse(textRes); } catch (e) { }

        if (!response.ok) {
          throw new Error(data?.error?.message || data?.error || textRes.slice(0, 100) || 'Unknown API error');
        }

        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const parsed = parseGeminiJson(text);
        parsed.image = `data:${mediaType};base64,${base64}`;
        renderAiParsedSuccess(parsed);
      } catch (e) {
        console.error(e);
        aiParsingSlot.innerHTML = '';
        statusEl.textContent = "Error reading poster — please add details below.";
        openReview({});
      }
    }

    function renderAiParsingState() {
      statusEl.textContent = '';
      reviewSlot.innerHTML = '';
      aiParsingSlot.innerHTML = `
        <div class="ai-parsing-card">
          <div class="parsing-status-bar">
            <div class="spinner"></div>
            <span>Reading your post…</span>
          </div>
          <div class="parsed-field">🎵 <strong>Artist:</strong> <span>Detecting...</span></div>
          <div class="parsed-field">📅 <strong>Date:</strong> <span>Detecting...</span></div>
          <div class="parsed-field">🕐 <strong>Time:</strong> <span>Detecting...</span></div>
          <div class="parsed-field">📍 <strong>Venue & City:</strong> <span>Detecting...</span></div>
        </div>`;
      aiParsingSlot.scrollIntoView({ behavior: 'smooth' });
    }

    function renderAiParsedSuccess(parsed) {
      const locStr = [parsed.venue, parsed.city].filter(Boolean).join(', ') || 'Venue not specified';
      aiParsingSlot.innerHTML = `
        <div class="ai-parsing-card">
          <div class="parsing-status-bar" style="color: var(--purple-light);">
            <span>✨ Event detected!</span>
          </div>
          <div class="parsed-field">🎵 <strong>Artist:</strong> <span>${escapeHtml(parsed.artist || 'Untitled event')}</span></div>
          <div class="parsed-field">📅 <strong>Date:</strong> <span>${fmtDate(parsed.startDate)}</span></div>
          <div class="parsed-field">🕐 <strong>Time:</strong> <span>${parsed.time || 'Not specified'}</span></div>
          <div class="parsed-field">📍 <strong>Location:</strong> <span>${escapeHtml(locStr)}</span></div>
          <div class="parsed-field">🏷️ <strong>Category:</strong> <span class="category-pill">${escapeHtml(parsed.category || 'Concert')}</span></div>
          
          <div style="font-size: 13px; font-weight: 600; color: #ffffff; margin: 16px 0 12px;">Looks good?</div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="btnCancelParsed">Cancel</button>
            <button class="btn btn-primary" id="btnConfirmParsed">Add to cue →</button>
          </div>
        </div>`;

      document.getElementById('btnCancelParsed').onclick = () => { aiParsingSlot.innerHTML = ''; };
      document.getElementById('btnConfirmParsed').onclick = () => {
        aiParsingSlot.innerHTML = '';
        openReview(parsed);
      };
    }

    function openReview(prefill) {
      reviewSlot.innerHTML = `
        <div class="review">
          <input type="hidden" id="f_image" value="${escapeAttr(prefill.image || '')}">
          <h3>Confirm event details</h3>
          <div class="field"><label>Artist / Event Name</label><input id="f_artist" value="${escapeAttr(prefill.artist || prefill.name || '')}" placeholder="e.g. Branko, Slow J, Festival X"></div>
          
          <div class="review-row">
            <div class="field"><label>Start Date</label><input id="f_start" type="date" value="${prefill.startDate || ''}"></div>
            <div class="field"><label>Time</label><input id="f_time" type="time" value="${prefill.time || ''}"></div>
          </div>

          <div class="review-row">
            <div class="field"><label>Venue</label><input id="f_venue" value="${escapeAttr(prefill.venue || '')}" placeholder="e.g. Armazém 22, Coliseu"></div>
            <div class="field"><label>City</label><input id="f_city" list="pt-cities" value="${escapeAttr(prefill.city || '')}" placeholder="e.g. Porto, Lisboa"></div>
          </div>

          <div class="field">
            <label>Category</label>
            <select id="f_category">
              <option value="Concert" ${prefill.category === 'Concert' ? 'selected' : ''}>Concert</option>
              <option value="Festival" ${prefill.category === 'Festival' ? 'selected' : ''}>Festival</option>
              <option value="Party" ${prefill.category === 'Party' ? 'selected' : ''}>Party</option>
              <option value="Other" ${prefill.category === 'Other' ? 'selected' : ''}>Other</option>
            </select>
          </div>

          <div class="field"><label>Note</label><textarea id="f_desc" placeholder="Anything worth remembering">${escapeHtml(prefill.description || '')}</textarea></div>
          
          <div class="btn-row">
            <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
            <button class="btn btn-primary" id="saveBtn">Add to cue →</button>
          </div>
        </div>`;

      document.getElementById('cancelBtn').onclick = () => { reviewSlot.innerHTML = ''; statusEl.textContent = ''; };
      document.getElementById('saveBtn').onclick = async () => {
        const ev = {
          id: prefill.id || uid(),
          artist: document.getElementById('f_artist').value.trim(),
          startDate: document.getElementById('f_start').value,
          time: document.getElementById('f_time').value,
          venue: document.getElementById('f_venue').value.trim(),
          city: document.getElementById('f_city').value.trim(),
          category: document.getElementById('f_category').value,
          description: document.getElementById('f_desc').value.trim(),
          image: document.getElementById('f_image').value
        };
        if (prefill.id) {
          events = events.map(e => e.id === ev.id ? ev : e);
        } else {
          events.push(ev);
        }
        await saveEvents();
        reviewSlot.innerHTML = '';
        statusEl.textContent = 'Added to cue ✓';
        fileInput.value = '';
        render();
        renderCalendar();
        switchTab('queue');
        setTimeout(() => { if (statusEl.textContent === 'Added to cue ✓') statusEl.textContent = ''; }, 2500);
      };
      reviewSlot.scrollIntoView({ behavior: 'smooth' });
    }

    function openDetailModal(ev) {
      const dateStr = fmtDate(ev.startDate);
      const timeStr = ev.time ? ` · ${ev.time}` : '';
      const locStr = [ev.venue, ev.city].filter(Boolean).join(' · ');
      const overlay = document.getElementById('eventModalOverlay');
      const content = document.getElementById('eventModalContent');

      content.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <span class="category-pill">${escapeHtml(ev.category || 'Concert')}</span>
          <button class="icon-btn" id="closeModalBtn" style="font-size:18px; color:var(--text-muted);">✕</button>
        </div>
        ${ev.image ? `<img src="${ev.image}" class="full-modal-img" alt="Poster">` : ''}
        <h2 style="margin: 8px 0 6px; font-weight:700; font-size:22px; color:#ffffff;">${escapeHtml(ev.artist || 'Untitled event')}</h2>
        <div style="font-size:14px; color:var(--text-muted); margin-bottom:6px;">📅 ${dateStr}${timeStr}</div>
        ${locStr ? `<div style="font-size:14px; color:var(--text-muted); margin-bottom:16px;">📍 ${escapeHtml(locStr)}</div>` : ''}
        ${ev.description ? `<div style="background:#09090b; padding:14px; border-radius:10px; border:1px solid var(--border); font-size:13px; margin-bottom:20px; white-space:pre-wrap; color:var(--text-main);"><strong>Note:</strong><br>${escapeHtml(ev.description)}</div>` : ''}
        
        <div class="btn-row">
          <button class="btn btn-ghost" id="editFromModalBtn">✏️ Edit</button>
          <button class="btn btn-primary" id="gcalFromModalBtn">📅 Add to Google Cal</button>
        </div>
        <div class="btn-row" style="margin-top: 10px;">
          <button class="btn btn-ghost" id="icsFromModalBtn">📥 Download .ics</button>
          <button class="btn btn-ghost" id="btnDelFromModal" style="color:var(--danger); border-color:rgba(239,68,68,0.3);">🗑️ Delete</button>
        </div>`;

      overlay.classList.add('active');

      const closeModal = () => overlay.classList.remove('active');
      document.getElementById('closeModalBtn').onclick = closeModal;
      overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };

      document.getElementById('btnDelFromModal').onclick = async () => {
        closeModal();
        await deleteEvent(ev.id);
      };
      document.getElementById('editFromModalBtn').onclick = () => {
        closeModal();
        switchTab('add');
        openReview(ev);
      };
      document.getElementById('gcalFromModalBtn').onclick = () => { window.open(gcalUrl(ev), '_blank'); };
      document.getElementById('icsFromModalBtn').onclick = () => { downloadIcs(ev); };
    }

    function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

    // ---- Interactive Visual Calendar Engine ----
    function renderCalendar() {
      const year = calCurrentDate.getFullYear();
      const month = calCurrentDate.getMonth();
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      
      document.getElementById('calMonthTitle').textContent = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = new Date().toISOString().slice(0, 10);

      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'cal-cell empty-cell';
        grid.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        if (dayStr === todayStr) cell.classList.add('today');
        if (dayStr === calSelectedDateStr) cell.classList.add('selected');

        cell.textContent = day;

        const dayEvents = events.filter(e => {
          if (!e.startDate) return false;
          if (e.endDate) return dayStr >= e.startDate && dayStr <= e.endDate;
          return e.startDate === dayStr;
        });

        if (dayEvents.length > 0) {
          const dot = document.createElement('div');
          dot.className = 'cal-dot';
          cell.appendChild(dot);
        }

        cell.onclick = () => {
          calSelectedDateStr = dayStr;
          renderCalendar();
          renderSelectedDateEvents(dayStr, dayEvents);
        };

        grid.appendChild(cell);
      }

      if (!calSelectedDateStr) {
        calSelectedDateStr = todayStr;
      }
      const initialEvents = events.filter(e => {
        if (!e.startDate) return false;
        if (e.endDate) return calSelectedDateStr >= e.startDate && calSelectedDateStr <= e.endDate;
        return e.startDate === calSelectedDateStr;
      });
      renderSelectedDateEvents(calSelectedDateStr, initialEvents);
    }

    function renderSelectedDateEvents(dateStr, dayEvents) {
      document.getElementById('calSelectedTitle').textContent = `YOUR EVENTS (${dateStr})`;
      const list = document.getElementById('calSelectedList');
      list.innerHTML = dayEvents.length
        ? dayEvents.map(queueItemHTML).join('')
        : '<div class="empty">No events scheduled on this date.</div>';

      document.querySelectorAll('#calSelectedList [data-view]').forEach(el => {
        el.onclick = () => {
          const ev = events.find(e => e.id === el.getAttribute('data-view'));
          openDetailModal(ev);
        };
      });
    }

    document.getElementById('calPrevBtn').onclick = () => {
      calCurrentDate.setMonth(calCurrentDate.getMonth() - 1);
      renderCalendar();
    };
    document.getElementById('calNextBtn').onclick = () => {
      calCurrentDate.setMonth(calCurrentDate.getMonth() + 1);
      renderCalendar();
    };

    loadEvents();
    checkForSharedData();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
    }

    async function checkForSharedData() {
      const fullUrl = window.location.href;
      
      const searchParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace('#', '?'));

      let sharedText = searchParams.get('text') || searchParams.get('url') || searchParams.get('title') ||
                        hashParams.get('text') || hashParams.get('url') || hashParams.get('title');

      if (!sharedText && fullUrl.includes('?')) {
        const queryPart = fullUrl.split('?')[1] || '';
        const match = queryPart.match(/(?:text|url|title)=([^&]+)/i);
        if (match && match[1]) {
          try { sharedText = decodeURIComponent(match[1]); } catch(e) { sharedText = match[1]; }
        }
      }

      if (sharedText && searchParams.get('shared') !== '1') {
        window.history.replaceState({}, '', window.location.pathname);
        switchTab('add');
        handleSharedText(sharedText);
        return;
      }

      if (searchParams.get('shared') === '1') {
        window.history.replaceState({}, '', window.location.pathname);
        switchTab('add');
        try {
          const cache = await caches.open('someday-shared-v1');
          const res = await cache.match('shared-image');
          if (res) {
            const blob = await res.blob();
            await cache.delete('shared-image');
            renderAiParsingState();
            const file = new File([blob], 'shared.jpg', { type: blob.type || 'image/jpeg' });
            handleFile(file);
          }
        } catch (e) {
          console.warn('No shared image found', e);
        }
      }
    }

    function getApiEndpoint() {
      return (window.location.hostname.includes('vercel.app') || window.location.hostname.includes('vercel'))
        ? '/api/gemini'
        : '/.netlify/functions/gemini';
    }

    function parseGeminiJson(text) {
      if (!text) return {};
      const match = text.match(/\{[\s\S]*\}/);
      if (match) {
        try { return JSON.parse(match[0]); } catch(e) {}
      }
      try {
        const clean = text.replace(/```json|```/g, '').trim();
        return JSON.parse(clean);
      } catch(e) {}
      return {};
    }

    async function handleSharedText(sharedText) {
      switchTab('add');
      renderAiParsingState();
      try {
        const response = await fetch(getApiEndpoint(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sharedUrl: sharedText })
        });

        const textRes = await response.text();
        let data;
        try { data = JSON.parse(textRes); } catch (e) { }

        if (!response.ok) {
          throw new Error(data?.error?.message || data?.error || textRes.slice(0, 100) || 'Unknown API error');
        }

        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const parsed = parseGeminiJson(text);
        if (data._extractedImage) {
          parsed.image = data._extractedImage;
        }

        renderAiParsedSuccess(parsed);
      } catch (e) {
        console.error(e);
        aiParsingSlot.innerHTML = '';
        statusEl.textContent = "Please confirm event details below.";
        openReview({});
      }
    }
  </script>

  <!-- Dedicated Event Detail Modal Overlay -->
  <div id="eventModalOverlay" class="modal-overlay">
    <div class="modal-content" id="eventModalContent"></div>
  </div>
</body>

</html>
