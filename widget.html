<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cue widget</title>
    <style>
        :root {
            --purple: #a855f7;
            --purple-light: #c084fc;
            --bg: #000;
            --surface: #121214;
            --border: #27272a;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, 'Inter', BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: #fff;
            border-radius: 16px;
            overflow: hidden;
            padding: 14px;
            min-height: 120px;
        }

        #widgetContent {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .widget-logo {
            font-weight: 800;
            font-size: 16px;
            color: var(--purple);
            letter-spacing: -0.04em;
        }

        .widget-badge {
            font-size: 10px;
            font-weight: 700;
            background: rgba(168, 85, 247, 0.2);
            color: var(--purple-light);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 99px;
            padding: 2px 8px;
        }

        .widget-event {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            grid-template-rows: auto auto auto;
            column-gap: 10px;
            row-gap: 3px;
        }

        .widget-event-image {
            width: 42px;
            height: 42px;
            grid-row: 1 / span 3;
            border-radius: 8px;
            object-fit: cover;
            background: #27272a;
            border: 1px solid var(--border);
        }

        .widget-event-name {
            min-width: 0;
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 2px 4px;
            font-size: 14px;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .widget-event-name span {
            display: block;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .widget-event-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .widget-event-location {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .widget-more {
            color: var(--purple-light);
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            padding: 2px 0 4px;
        }

        .widget-empty {
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            padding: 20px 0;
        }

        .days-badge {
            font-size: 10px;
            font-weight: 700;
            color: var(--purple-light);
            align-self: flex-start;
        }
    </style>
</head>

<body>
    <div class="widget-header">
        <div class="widget-logo">cue✦</div>
        <div class="widget-badge" id="widgetBadge">0 upcoming</div>
    </div>
    <div id="widgetContent">
        <div class="widget-empty">No upcoming events</div>
    </div>

    <script>
        function fmtDate(dStr) {
            if (!dStr) return '';
            const d = new Date(dStr + 'T00:00:00');
            if (isNaN(d)) return dStr;
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function isPast(ev) {
            const d = new Date((ev.endDate || ev.startDate) + 'T23:59:59');
            return d < new Date();
        }

        function imageUrl(event) {
            const value = String(event.image || '');
            if (/^data:image\/(jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(value)) return value;
            if (/^https:\/\//i.test(value)) return value;
            return '';
        }

                function renderWidget() {
                    try {
            const raw = localStorage.getItem('cue-events-v12');
            const events = raw ? JSON.parse(raw) : [];
            const upcoming = events
                .filter(e => !isPast(e) && e.startDate)
                .sort((a, b) => a.startDate.localeCompare(b.startDate));

            document.getElementById('widgetBadge').textContent =
                upcoming.length + ' upcoming';

            if (upcoming.length > 0) {
                const availableHeight = window.innerHeight || document.documentElement.clientHeight || 160;
                const visibleCount = Math.max(1, Math.floor((availableHeight - 54) / 70));
                const visibleEvents = upcoming.slice(0, visibleCount);
                                const cards = visibleEvents.map(event => `
                    <div class="widget-event">
                        ${imageUrl(event) ? `<img class="widget-event-image" src="${imageUrl(event)}" alt="">` : '<div class="widget-event-image"></div>'}
                        <div class="widget-event-name" title="${event.artist || 'Untitled event'}"><span>${event.artist || 'Untitled event'}</span></div>
                        <div class="widget-event-date">${fmtDate(event.startDate)}</div>
                        ${event.venue || event.city ? `<div class="widget-event-location">${[event.venue, event.city].filter(Boolean).join(', ')}</div>` : ''}
                    </div>`).join('');
                                const remaining = upcoming.length - visibleEvents.length;
                                document.getElementById('widgetContent').innerHTML = cards + (remaining > 0
                                        ? `<div class="widget-more">+${remaining} more events</div>`
                                        : '');
            }
                    } catch (e) { }
                }

                renderWidget();
                new ResizeObserver(renderWidget).observe(document.body);
    </script>
</body>

</html>
