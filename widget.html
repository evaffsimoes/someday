<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cue widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #a855f7;
            --purple-light: #c084fc;
            --bg: #09090b;
            --surface: #141417;
            --surface-hover: #1c1c21;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f5;
            --text-muted: #94949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            border-radius: 20px;
            overflow: hidden;
            padding: 14px 16px;
            min-height: 140px;
            line-height: 1.4;
        }

        #widgetContent {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .widget-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            letter-spacing: -0.04em;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .widget-logo .gem {
            color: var(--purple);
            font-size: 16px;
        }

        .widget-badge {
            font-size: 11px;
            font-weight: 700;
            background: rgba(168, 85, 247, 0.15);
            color: var(--purple-light);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 99px;
            padding: 3px 10px;
            letter-spacing: 0.02em;
        }

        .widget-event {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: background 0.2s ease;
        }

        .widget-event-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
            flex: 1;
        }

        .widget-event-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .widget-event-location {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .widget-event-badge {
            min-width: 54px;
            padding: 9px 4px;
            border-radius: 10px;
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.2);
            color: var(--purple-light);
            text-align: center;
            line-height: 1.1;
            flex-shrink: 0;
        }

        .widget-event-badge strong {
            display: block;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.15;
        }

        .widget-event-badge small {
            display: block;
            margin-top: 2px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .widget-more {
            color: var(--purple-light);
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            padding: 4px 0 2px;
            letter-spacing: 0.02em;
        }

        .widget-empty {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .widget-empty-icon {
            font-size: 24px;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="widget-header">
        <div class="widget-logo">cue<span class="gem">✦</span></div>
        <div class="widget-badge" id="widgetBadge">0 upcoming</div>
    </div>
    <div id="widgetContent">
        <div class="widget-empty">
            <span>No upcoming events</span>
        </div>
    </div>

    <script>
        function fmtDate(dStr, endStr) {
            if (!dStr) return '';
            const d = new Date(dStr + 'T00:00:00');
            if (isNaN(d)) return dStr;

            if (endStr && endStr !== dStr) {
                const endD = new Date(endStr + 'T00:00:00');
                if (!isNaN(endD) && endD > d) {
                    const startFmt = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                    const endFmt = endD.getMonth() === d.getMonth()
                        ? endD.getDate()
                        : endD.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                    return `${startFmt}–${endFmt}`;
                }
            }

            const now = new Date();
            now.setHours(0,0,0,0);
            const diffDays = Math.round((d - now) / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Tomorrow';
            if (diffDays > 1 && diffDays <= 7) return `In ${diffDays} days`;
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        function isPast(ev) {
            const d = new Date((ev.endDate || ev.startDate) + 'T23:59:59');
            return d < new Date();
        }

        function imageUrl(event) {
            const value = String(event.image || '');
            if (/^data:image\/(jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(value)) return value;
            if (/^https:\/\//i.test(value)) return value;
            return '';
        }

        const TEST_WIDGET_EVENTS = [
            { id: 'tw-1', artist: 'Sonar Festival 2026', category: 'Festival', startDate: '2026-09-12', endDate: '2026-09-14', time: '18:00', city: 'Lisbon', venue: 'Parque das Nações' },
            { id: 'tw-2', artist: 'Tame Impala', category: 'Concert', startDate: '2026-09-18', endDate: '2026-09-18', time: '21:30', city: 'Lisbon', venue: 'MEO Arena' },
            { id: 'tw-3', artist: 'Peggy Gou', category: 'Party', startDate: '2026-09-25', endDate: '2026-09-25', time: '23:00', city: 'Lisbon', venue: 'Lux Frágil' }
        ];

        function renderWidget() {
            try {
                const raw = localStorage.getItem('cue-events-v12');
                let events = raw ? JSON.parse(raw) : [];
                if (!events || events.length === 0) events = TEST_WIDGET_EVENTS;
                const upcoming = events
                    .filter(e => !isPast(e) && e.startDate)
                    .sort((a, b) => a.startDate.localeCompare(b.startDate));

                document.getElementById('widgetBadge').textContent =
                    upcoming.length + (upcoming.length === 1 ? ' upcoming' : ' upcoming');

                if (upcoming.length > 0) {
                    const availableHeight = window.innerHeight || document.documentElement.clientHeight || 160;
                    const visibleCount = Math.max(1, Math.floor((availableHeight - 54) / 72));
                    const visibleEvents = upcoming.slice(0, visibleCount);
                    const cards = visibleEvents.map(event => {
                        const d = new Date(event.startDate + 'T00:00:00');
                        const dayNum = !isNaN(d) ? d.getDate() : '—';
                        const monStr = !isNaN(d) ? d.toLocaleDateString(undefined, { month: 'short' }) : '';
                        const dateStr = fmtDate(event.startDate, event.endDate);
                        const dateTimeStr = dateStr + (event.time ? ` · ${event.time}` : '');
                        const locStr = [event.city, event.venue].filter(Boolean).join(' · ');
                        return `
                        <div class="widget-event">
                            <div class="widget-event-badge">
                                <strong>${dayNum}</strong>
                                <small>${monStr}</small>
                            </div>
                            <div class="widget-event-info">
                                <div class="widget-event-name" title="${event.artist || 'Untitled event'}">${event.artist || 'Untitled event'}</div>
                                <div class="widget-event-date">${dateTimeStr}</div>
                                ${locStr ? `<div class="widget-event-location">${locStr}</div>` : ''}
                            </div>
                        </div>`;
                    }).join('');
                    const remaining = upcoming.length - visibleEvents.length;
                    document.getElementById('widgetContent').innerHTML = cards + (remaining > 0
                        ? `<div class="widget-more">+${remaining} more events</div>`
                        : '');
                } else {
                    document.getElementById('widgetContent').innerHTML = `
                        <div class="widget-empty">
                            <span>No upcoming events</span>
                        </div>`;
                }
            } catch (e) { }
        }

        renderWidget();
        new ResizeObserver(renderWidget).observe(document.body);
    </script>
</body>

</html>
