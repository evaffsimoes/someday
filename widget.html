<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cue widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #a855f7;
            --purple-light: #c084fc;
            --bg: #09090b;
            --surface: #141417;
            --surface-hover: #1c1c21;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f5;
            --text-muted: #94949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            border-radius: 20px;
            overflow: hidden;
            padding: 14px 16px;
            min-height: 140px;
            line-height: 1.4;
        }

        #widgetContent {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .widget-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            letter-spacing: -0.04em;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .widget-logo .gem {
            color: var(--purple);
            font-size: 16px;
        }

        .widget-badge {
            font-size: 11px;
            font-weight: 700;
            background: rgba(168, 85, 247, 0.15);
            color: var(--purple-light);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 99px;
            padding: 3px 10px;
            letter-spacing: 0.02em;
        }

        .widget-event {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 12px;
            display: grid;
            grid-template-columns: 46px minmax(0, 1fr);
            column-gap: 12px;
            row-gap: 2px;
            align-items: center;
            transition: background 0.2s ease;
        }

        .widget-event-image {
            width: 46px;
            height: 46px;
            grid-row: 1 / span 3;
            border-radius: 10px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .widget-event-placeholder {
            width: 46px;
            height: 46px;
            grid-row: 1 / span 3;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(192, 132, 252, 0.05));
            border: 1px solid rgba(168, 85, 247, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--purple-light);
            font-size: 18px;
        }

        .widget-event-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .widget-event-date {
            font-size: 11px;
            font-weight: 600;
            color: var(--purple-light);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .widget-event-location {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .widget-more {
            color: var(--purple-light);
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            padding: 4px 0 2px;
            letter-spacing: 0.02em;
        }

        .widget-empty {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .widget-empty-icon {
            font-size: 24px;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="widget-header">
        <div class="widget-logo">cue<span class="gem">✦</span></div>
        <div class="widget-badge" id="widgetBadge">0 upcoming</div>
    </div>
    <div id="widgetContent">
        <div class="widget-empty">
            <span>No upcoming events</span>
        </div>
    </div>

    <script>
        function fmtDate(dStr) {
            if (!dStr) return '';
            const d = new Date(dStr + 'T00:00:00');
            if (isNaN(d)) return dStr;
            const now = new Date();
            now.setHours(0,0,0,0);
            const diffDays = Math.round((d - now) / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Tomorrow';
            if (diffDays > 1 && diffDays <= 7) return `In ${diffDays} days`;
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        function isPast(ev) {
            const d = new Date((ev.endDate || ev.startDate) + 'T23:59:59');
            return d < new Date();
        }

        function imageUrl(event) {
            const value = String(event.image || '');
            if (/^data:image\/(jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(value)) return value;
            if (/^https:\/\//i.test(value)) return value;
            return '';
        }

        function renderWidget() {
            try {
                const raw = localStorage.getItem('cue-events-v12');
                const events = raw ? JSON.parse(raw) : [];
                const upcoming = events
                    .filter(e => !isPast(e) && e.startDate)
                    .sort((a, b) => a.startDate.localeCompare(b.startDate));

                document.getElementById('widgetBadge').textContent =
                    upcoming.length + (upcoming.length === 1 ? ' upcoming' : ' upcoming');

                if (upcoming.length > 0) {
                    const availableHeight = window.innerHeight || document.documentElement.clientHeight || 160;
                    const visibleCount = Math.max(1, Math.floor((availableHeight - 54) / 72));
                    const visibleEvents = upcoming.slice(0, visibleCount);
                    const cards = visibleEvents.map(event => `
                        <div class="widget-event">
                            ${imageUrl(event) 
                                ? `<img class="widget-event-image" src="${imageUrl(event)}" alt="">` 
                                : '<div class="widget-event-placeholder">✦</div>'}
                            <div class="widget-event-name" title="${event.artist || 'Untitled event'}">${event.artist || 'Untitled event'}</div>
                            <div class="widget-event-date">${fmtDate(event.startDate)}${event.time ? ` • ${event.time}` : ''}</div>
                            ${event.venue || event.city ? `<div class="widget-event-location">${[event.city, event.venue].filter(Boolean).join(' · ')}</div>` : ''}
                        </div>`).join('');
                    const remaining = upcoming.length - visibleEvents.length;
                    document.getElementById('widgetContent').innerHTML = cards + (remaining > 0
                        ? `<div class="widget-more">+${remaining} more events</div>`
                        : '');
                } else {
                    document.getElementById('widgetContent').innerHTML = `
                        <div class="widget-empty">
                            <span>No upcoming events</span>
                        </div>`;
                }
            } catch (e) { }
        }

        renderWidget();
        new ResizeObserver(renderWidget).observe(document.body);
    </script>
</body>

</html>
